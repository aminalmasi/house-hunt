name: cost-probe

# One-off: how many proxy bytes does each portal cost per poll, and which ones
# block GitHub's datacenter IPs? Prints sizes and status codes only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.47.0 requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe portals
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python probe/cost_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_results.json
